[project]
name = "chars-extractor"
version = "0.1.0"
description = "Извлечение и сопоставление характеристик запроса с кандидатами КТРУ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
