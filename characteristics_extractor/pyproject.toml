[project]
name = "characteristics-extractor"
version = "0.1.0"
description = "Stateless-извлечение характеристик КТРУ и уточнение пользовательского запроса"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.0,<3",
    "httpx>=0.28.1,<1",
    "fastapi>=0.143.0,<1",
    "uvicorn>=0.54.0,<1",
    "python-dotenv>=1.2.1,<2",
    "pint>=0.25,<1",
    "pymorphy3>=2.0.6,<3",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
